<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>🎂 A Surprise for Sneha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ffd3e2; --pink-deep:#ff9ec4; --lav:#e6d9ff; --cream:#fff7f0;
    --ink:#5b3a4a; --gold:#ffcf7a; --card:#fffaf6;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; font-family:'Quicksand',sans-serif; }
  body{
    background:linear-gradient(160deg,var(--cream),var(--pink) 55%,var(--lav));
    color:var(--ink); position:relative;
  }

  #fx{ position:fixed; inset:0; pointer-events:none; z-index:2; overflow:hidden; }
  .drop{ position:absolute; top:-10%; opacity:0.9; animation:fall linear infinite; will-change:transform; }
  @keyframes fall{
    0%{ transform:translateY(0) translateX(0) rotate(0deg); }
    100%{ transform:translateY(112vh) translateX(var(--drift,20px)) rotate(360deg); }
  }

  .screen{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    padding:24px; z-index:5; opacity:0; pointer-events:none; transition:opacity .6s ease;
  }
  .screen.active{ opacity:1; pointer-events:auto; }

  /* ---------- PASSCODE SCREEN ---------- */
  .card{
    background:var(--card); border-radius:28px; padding:38px 30px;
    width:min(360px,92vw); text-align:center;
    box-shadow:0 30px 60px -20px rgba(200,80,140,0.35), 0 0 0 6px rgba(255,255,255,0.6) inset;
    border:2px dashed var(--pink-deep);
  }
  .paw{ font-size:42px; margin-bottom:6px; }
  .card h1{ font-family:'Baloo 2',cursive; font-size:24px; color:#d9527d; margin-bottom:6px; }
  .card p{ font-size:13.5px; color:#a2748a; margin-bottom:20px; line-height:1.5; }
  #passInput{
    width:100%; padding:13px 16px; border-radius:16px; border:2px solid var(--pink);
    font-family:'Quicksand',sans-serif; font-size:15px; text-align:center;
    outline:none; letter-spacing:2px; color:var(--ink); background:#fff;
    transition:border-color .2s ease;
  }
  #passInput:focus{ border-color:var(--pink-deep); }
  #unlockBtn{
    margin-top:16px; width:100%; padding:13px; border:none; border-radius:16px;
    font-family:'Baloo 2',cursive; font-size:16px; letter-spacing:0.5px;
    background:linear-gradient(135deg,var(--pink-deep),#ff7fae); color:#fff; cursor:pointer;
    box-shadow:0 10px 20px -8px rgba(255,110,160,0.6);
    transition:transform .15s ease;
  }
  #unlockBtn:active{ transform:scale(.96); }
  #errMsg{
    margin-top:14px; font-size:13px; color:#e14b7a; font-weight:600;
    min-height:18px; opacity:0; transition:opacity .25s ease;
  }
  #errMsg.show{ opacity:1; }
  .shake{ animation:shake .45s ease; }
  @keyframes shake{
    10%,90%{ transform:translateX(-3px); } 20%,80%{ transform:translateX(6px); }
    30%,50%,70%{ transform:translateX(-9px); } 40%,60%{ transform:translateX(9px); }
  }

  /* ---------- STORY (multi-page) SCREEN ---------- */
  #story{ flex-direction:column; }
  .story-card{
    background:var(--card); border-radius:28px; padding:40px 30px 30px;
    width:min(420px,92vw); text-align:center; position:relative;
    box-shadow:0 30px 60px -20px rgba(200,80,140,0.35), 0 0 0 6px rgba(255,255,255,0.6) inset;
    min-height:300px; display:flex; flex-direction:column; justify-content:center; gap:10px;
  }
  .page{ display:none; flex-direction:column; align-items:center; gap:12px; animation:fadein .5s ease; }
  .page.active{ display:flex; }
  @keyframes fadein{ from{ opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .page .icon{ font-size:52px; }
  .page h2{ font-family:'Baloo 2',cursive; font-size:clamp(20px,5.5vw,28px); color:#d9527d; line-height:1.3; }
  .page p{ font-size:14px; color:#8a5b74; line-height:1.7; max-width:340px; }

  .dots{ display:flex; gap:7px; justify-content:center; margin-top:18px; }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--pink); transition:all .3s ease; }
  .dot.active{ background:var(--pink-deep); width:20px; border-radius:5px; }

  #nextBtn{
    margin-top:20px; padding:12px 30px; border:none; border-radius:16px;
    font-family:'Baloo 2',cursive; font-size:15px;
    background:linear-gradient(135deg,var(--pink-deep),#ff7fae); color:#fff; cursor:pointer;
    box-shadow:0 10px 20px -8px rgba(255,110,160,0.6);
    transition:transform .15s ease;
  }
  #nextBtn:active{ transform:scale(.95); }

  .cake{ font-size:64px; animation:bob 2.4s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-2deg);} 50%{ transform:translateY(-10px) rotate(2deg);} }

  .cake-wrap{ position:relative; display:inline-block; transition:transform .4s ease; }
  .cake-wrap.falling{ animation:cakeFall 0.9s cubic-bezier(.5,0,.75,0) forwards; }
  @keyframes cakeFall{
    0%{ transform:translateY(0) rotate(0deg); }
    55%{ transform:translateY(35vh) rotate(180deg); }
    100%{ transform:translateY(120vh) rotate(400deg); opacity:0.4; }
  }
  .cake-wrap.bounce-back{ animation:cakeBounce 0.6s ease; }
  @keyframes cakeBounce{
    0%{ transform:translateY(0) scale(1.3) rotate(0deg); opacity:1; }
    50%{ transform:translateY(-14px) scale(0.9); }
    100%{ transform:translateY(0) scale(1); }
  }
  .candle{
    position:absolute; top:-14px; font-size:15px;
    animation:flicker 0.6s ease-in-out infinite alternate;
    transition:opacity .5s ease, transform .5s ease;
  }
  .candle.c1{ left:14px; animation-delay:.1s; }
  .candle.c2{ left:34px; top:-19px; animation-delay:.3s; }
  .candle.c3{ left:54px; animation-delay:.05s; }
  @keyframes flicker{ from{ transform:scale(1) rotate(-2deg);} to{ transform:scale(1.15) rotate(2deg);} }
  .candle.blown{ opacity:0; transform:translateY(-10px) scale(.6); animation:none; }

  .poke{
    margin-top:12px; font-size:12.5px; color:#c2547a;
    background:#fff0f5; border:1px dashed var(--pink-deep);
    padding:8px 16px; border-radius:14px; display:inline-block;
    opacity:0; transform:translateY(6px); transition:opacity .4s ease, transform .4s ease;
  }
  .poke.show{ opacity:1; transform:translateY(0); animation:pokeBounce 1.6s ease-in-out infinite; }
  @keyframes pokeBounce{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-4px);} }

  .zoom-text{
    position:fixed; top:50%; left:50%; z-index:9;
    transform:translate(-50%,-50%) scale(0); opacity:0;
    font-family:'Baloo 2',cursive; font-size:clamp(30px,9vw,58px); color:#d9527d;
    text-shadow:0 4px 0 #fff, 0 10px 24px rgba(217,82,125,0.4);
    pointer-events:none; text-align:center; white-space:nowrap;
  }
  .zoom-text.show{ animation:zoomText 1.8s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes zoomText{
    0%{ transform:translate(-50%,-50%) scale(0); opacity:0; }
    35%{ transform:translate(-50%,-50%) scale(1.2); opacity:1; }
    55%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
    85%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
    100%{ transform:translate(-50%,-50%) scale(0.9); opacity:0; }
  }

  .balloons{ position:fixed; inset:0; pointer-events:none; z-index:3; overflow:hidden; }
  .balloon{ position:absolute; bottom:-20%; font-size:38px; animation:rise linear infinite; }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0.95; }
    100%{ transform:translateY(-130vh) translateX(var(--sway,30px)); opacity:0.85; }
  }

  .dog{
    position:fixed; bottom:14px; right:14px; font-size:56px; z-index:6;
    animation:wag 1.1s ease-in-out infinite;
    filter:drop-shadow(0 8px 10px rgba(0,0,0,0.15));
    cursor:pointer;
  }
  @keyframes wag{ 0%,100%{ transform:rotate(-6deg);} 50%{ transform:rotate(8deg);} }

  .pawline{ font-size:19px; opacity:0.8; margin-top:2px; }

  .twinkle{ position:fixed; inset:0; pointer-events:none; z-index:1; }
  .star{ position:absolute; font-size:12px; opacity:0.5; animation:twinkle 2.6s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{ opacity:0.15;} 50%{ opacity:0.7;} }

  @media (max-width:420px){
    .dog{ font-size:44px; }
    .cake{ font-size:52px; }
  }
</style>
</head>
<body>

<div class="twinkle" id="twinkle"></div>
<div id="fx"></div>
<div class="balloons" id="balloons"></div>

<div class="screen active" id="lock">
  <div class="card" id="card">
    <div class="paw">🔐🐾</div>
    <h1>Ek Surprise Hai!</h1>
    <p>Passcode daalo aur dekho kya hai andar 👀</p>
    <input type="text" id="passInput" placeholder="Passcode" autocomplete="off" />
    <button id="unlockBtn">Unlock 💗</button>
    <div id="errMsg"></div>
  </div>
</div>

<div class="screen" id="story">
  <div class="story-card">
    <div id="pages"></div>
    <div class="dots" id="dots"></div>
    <button id="nextBtn">Next →</button>
    <div class="poke" id="poke">Yay dabate raho aur dekho 👀</div>
  </div>
</div>

<div class="dog" id="dog">🐶</div>

<script>
  // ---------- background sparkle ----------
  const twinkle = document.getElementById('twinkle');
  for(let i=0;i<24;i++){
    const s = document.createElement('span');
    s.className = 'star';
    s.textContent = '✦';
    s.style.left = Math.random()*100+'vw';
    s.style.top = Math.random()*100+'vh';
    s.style.animationDelay = (Math.random()*2.6)+'s';
    twinkle.appendChild(s);
  }

  // ---------- falling hearts & flowers ----------
  const fx = document.getElementById('fx');
  function spawnDrop(list, count, sizeRange){
    for(let i=0;i<count;i++){
      const s = document.createElement('span');
      s.className = 'drop';
      s.textContent = list[Math.floor(Math.random()*list.length)];
      const size = sizeRange[0] + Math.random()*(sizeRange[1]-sizeRange[0]);
      s.style.left = Math.random()*100 + 'vw';
      s.style.fontSize = size + 'px';
      s.style.setProperty('--drift', (Math.random()*80-40)+'px');
      const dur = 7 + Math.random()*6;
      s.style.animationDuration = dur + 's';
      s.style.animationDelay = (Math.random()*dur) + 's';
      fx.appendChild(s);
    }
  }
  spawnDrop(['🌸','💗','🌷','✨'], 14, [16,26]);

  // ---------- passcode logic ----------
  let attempts = 0;
  const input = document.getElementById('passInput');
  const card = document.getElementById('card');
  const err = document.getElementById('errMsg');
  const wrongLines = [
    "Galat passcode hai Sneha, phir se try karo! 😜",
    "Uh oh, ye sahi nahi tha… ek aur chance! 💫",
    "Nope! Thoda aur soch ke try karo 🐾"
  ];

  function tryUnlock(){
    const val = input.value.trim();
    if(!val) return;
    attempts++;
    if(attempts === 1){
      err.textContent = wrongLines[Math.floor(Math.random()*wrongLines.length)];
      err.classList.add('show');
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      input.value = '';
      input.focus();
    } else {
      document.getElementById('lock').classList.remove('active');
      document.getElementById('story').classList.add('active');
    }
  }
  document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
  input.addEventListener('keydown', e => { if(e.key==='Enter') tryUnlock(); });

  // ---------- multi-page story ----------
  const pages = [
    { icon:'🌷', h:'Ruko, ek baat kahni hai…', p:'Aaj sirf birthday nahi hai — aaj us insaan ka din hai jo bina kuch kiye bhi special hai 🌸' },
    { icon:'🕰️', h:'Saal badal jaate hain,', p:'par kuch logon ki jagah kabhi nahi badalti… tum unme se ek ho.' },
    { icon:'💌', h:'Sach batau?', p:'Tum jitna khud ko normal samajhti ho, mere liye utni hi khaas ho — shayad usse bhi zyada.' },
    { icon:'🌙', h:'Chhoti si sacchai', p:'Kabhi kabhi din achha isliye lagta hai kyunki usme tumhara zikar hota hai 🙈' },
    { icon:'🐾', h:'Toh basically…', p:'Tum sirf ek din ki birthday girl nahi ho — tum meri list mein hamesha sabse upar rehti ho.' },
    { icon:'🎂', h:'Happy Birthday Sneha! 🎉', p:'Aaj ka din poori tarah tumhara hai. Muskurate raho, chamakti raho — aur bas itna yaad rakhna, tum mere liye kitni important ho 💗', final:true }
  ];

  const pagesEl = document.getElementById('pages');
  const dotsEl = document.getElementById('dots');
  const nextBtn = document.getElementById('nextBtn');
  const poke = document.getElementById('poke');
  let idx = 0;

  pages.forEach((pg,i) => {
    const div = document.createElement('div');
    div.className = 'page' + (i===0 ? ' active' : '');
    div.innerHTML = pg.final
      ? `<div class="cake-wrap"><span class="candle c1">🕯️</span><span class="candle c2">🕯️</span><span class="candle c3">🕯️</span><div class="cake">${pg.icon}</div></div><h2>${pg.h}</h2><p>${pg.p}</p><div class="pawline">🐾 🎈 🌷 🎈 🐾</div>`
      : `<div class="icon">${pg.icon}</div><h2>${pg.h}</h2><p>${pg.p}</p>`;
    pagesEl.appendChild(div);

    const dot = document.createElement('span');
    dot.className = 'dot' + (i===0 ? ' active' : '');
    dotsEl.appendChild(dot);
  });

  function showPage(i){
    document.querySelectorAll('.page').forEach((p,pi) => p.classList.toggle('active', pi===i));
    document.querySelectorAll('.dot').forEach((d,di) => d.classList.toggle('active', di===i));
    nextBtn.textContent = i === pages.length-1 ? 'Yay! 🎉' : 'Next →';
    poke.classList.toggle('show', i === pages.length-1);
  }

  nextBtn.addEventListener('click', () => {
    if(idx < pages.length-1){
      idx++;
      showPage(idx);
    } else {
      finalSurprise();
    }
  });

  const surprises = [
    { text:'Happy Birthday! 🎉', drops:['🌸','💗','🌷','✨','🎉','💕','🎊'] },
    { text:'Meri favorite insaan 🐾', drops:['🐾','💗','🌷','✨'] },
    { text:'Tum thoda zyada khaas ho 😌', drops:['💌','💗','✨','🌸'] },
    { text:'Bas yehi kehna tha 💗', drops:['💕','✨','🌷','🎉'] }
  ];
  let surpriseCount = 0;

  function finalSurprise(){
    if(surpriseCount === 0){
      document.querySelectorAll('.candle').forEach((c,i) => {
        setTimeout(() => c.classList.add('blown'), i*180);
      });
      poke.textContent = 'Aur dabao… 👀';
    }

    if(surpriseCount === 9){
      nextBtn.disabled = true;
      const cakeWrap = document.querySelector('.cake-wrap');
      cakeWrap.classList.add('falling');
      setTimeout(() => showZoomText('Cake gir gaya! 😂🎂'), 300);
      setTimeout(() => {
        cakeWrap.classList.remove('falling');
        cakeWrap.classList.add('bounce-back');
        celebrate(['😂','🎂','✨']);
        setTimeout(() => cakeWrap.classList.remove('bounce-back'), 650);
        nextBtn.disabled = false;
      }, 900);
      surpriseCount++;
      return;
    }

    const s = surprises[surpriseCount % surprises.length];
    const delay = surpriseCount === 0 ? 650 : 0;
    nextBtn.disabled = true;
    setTimeout(() => {
      celebrate(s.drops);
      showZoomText(s.text);
      nextBtn.disabled = false;
    }, delay);
    surpriseCount++;
  }

  function showZoomText(text){
    const z = document.createElement('div');
    z.className = 'zoom-text';
    z.textContent = text;
    document.body.appendChild(z);
    requestAnimationFrame(() => z.classList.add('show'));
    setTimeout(() => z.remove(), 2000);
  }

  function celebrate(dropList){
    spawnDrop(dropList || ['🌸','💗','🌷','✨','🎉','💕','🎊'], 40, [16,32]);
    const bwrap = document.getElementById('balloons');
    for(let i=0;i<14;i++){
      const b = document.createElement('span');
      b.className = 'balloon';
      b.textContent = '🎈';
      b.style.left = Math.random()*90+'vw';
      b.style.setProperty('--sway', (Math.random()*60-30)+'px');
      const dur = 6 + Math.random()*5;
      b.style.animationDuration = dur+'s';
      b.style.animationDelay = (Math.random()*2)+'s';
      bwrap.appendChild(b);
    }
  }

  document.getElementById('dog').addEventListener('click', () => {
    const d = document.getElementById('dog');
    d.textContent = d.textContent === '🐶' ? '🐕' : '🐶';
  });
</script>
</body>
</html>
